name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: withastro/action@v3
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # После выкладки сообщаем поисковикам по протоколу IndexNow (Яндекс, Bing и другие) о страницах сайта.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          sleep 30
          curl -s https://baikalresearch.ru/sitemap-0.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' > urls.txt
          jq -n --rawfile urls urls.txt '{host:"baikalresearch.ru", key:"2f3f6dfc2219f6fd2b6ecdd525e79a78", keyLocation:"https://baikalresearch.ru/2f3f6dfc2219f6fd2b6ecdd525e79a78.txt", urlList: ($urls | split("\n") | map(select(length>0)))}' > body.json
          cat body.json
          curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @body.json
